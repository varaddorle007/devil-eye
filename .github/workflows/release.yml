name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: devil-eye-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: devil-eye-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: devil-eye-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: devil-eye-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.target }}

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev pkg-config

      - name: Install libpcap (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpcap
          echo "PKG_CONFIG_PATH=$(brew --prefix libpcap)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$pwd\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/devil-eye
          cp "$BIN" "dist/${{ matrix.artifact }}"
          cp README.md LICENSE examples/scope.lab.json dist/
          cd dist
          tar -czf "../${{ matrix.artifact }}.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\devil-eye.exe" "dist\${{ matrix.artifact }}.exe"
          Copy-Item README.md, LICENSE, examples\scope.lab.json dist\
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
